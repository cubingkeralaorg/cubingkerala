name: Astro App CI/CD

# Scoped to astro-app/ only — the parallel Astro/Cloudflare rewrite being
# built on refactor/core-architecture. Deliberately separate from
# main-branch-ci.yml, which keeps deploying the live Next.js app to Vercel
# untouched until Phase 10's actual cutover (see the migration plan doc).
on:
  push:
    branches: [main]
    paths:
      - "astro-app/**"
      - ".github/workflows/astro-app-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "astro-app/**"
      - ".github/workflows/astro-app-ci.yml"
  # Lets this be re-run manually (Actions tab -> Run workflow) without
  # needing a dummy commit that happens to touch a path the triggers above
  # care about — an empty commit doesn't, since it changes no paths at all.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: astro-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astro-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        # Secrets (CLIENT_ID etc.) are Cloudflare runtime bindings, not
        # build-time values — confirmed the build needs none of them
        # present to succeed.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Deploy only triggers from pushes to the fork (allenjohn07/cubingkeralaorg)
    # — that's where CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are configured,
    # and it's the intended source of truth for deploys. If this workflow file
    # ever also exists on upstream's main (it will, once the sync step below
    # runs), a push there must NOT also deploy — this guard is what prevents
    # that, independent of where the file physically lives.
    if: github.repository == 'allenjohn07/cubingkeralaorg' && github.ref == 'refs/heads/main' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # persist-credentials: false matches sync-maintainer-fork.yml's
          # checkout — leaving the default GITHUB_TOKEN credential in place
          # overrides our PAT's URL on the later push step and causes
          # "Permission ... denied to github-actions[bot]" on upstream.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astro-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations to remote
        run: npx wrangler d1 migrations apply cubingkerala --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create deployment comment
        uses: actions/github-script@v9
        if: success()
        with:
          script: |
            const sha = context.sha;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `🚀 astro-app deployed to Cloudflare Workers.\n\n✅ Build + type-check passed\n🌐 Live at https://cubingkerala.com`
            })

      - name: Sync fork main to upstream
        # Mirrors sync-maintainer-fork.yml's mechanism, reversed: this repo
        # (the fork) is now the source of truth for deploys, so push the
        # deployed commit on to upstream rather than the other way around.
        # A force-push that lands on an already-identical SHA is a no-op in
        # git (nothing to push) and won't fire a new push event upstream —
        # that's what keeps this from ping-ponging with the existing
        # upstream→fork sync workflow.
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          cd ..
          if [ -z "${GH_TOKEN}" ]; then
            echo "SYNC_UPSTREAM_TOKEN secret is empty; skipping upstream sync."
            exit 0
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "Syncing HEAD → cubingkeralaorg/cubingkerala:main"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/cubingkeralaorg/cubingkerala.git" \
            "HEAD:refs/heads/main"
          echo "Upstream main updated."
